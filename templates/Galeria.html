
{% extends "base.html" %}

{% block setting %}
    {{ super() }}
    <title>Galeria - Barbearia X</title>
{% endblock %}

{% block content %}

<h1 class="text-center mt-4">Fotos de nossos clientes:</h1>

<!-- Carrossel -->
<div id="demo" class="carousel slide mt-4" data-bs-ride="carousel">

    <!-- Indicadores -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
    </div>

    <!-- Imagens -->
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="{{ url_for('static', filename='img/corte1.jpg') }}"
                 alt="Corte 1" class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='img/corte2.jpg') }}"
                 alt="Corte 2" class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='img/corte3.jpg') }}"
                 alt="Corte 3" class="d-block w-100">
        </div>

    </div>

    <!-- Setas -->
    <button class="carousel-control-prev" type="button"
            data-bs-target="#demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button"
            data-bs-target="#demo" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

{% endblock %}
